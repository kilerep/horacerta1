<style>
  /* Relatorios escritos: so tokens de tema, alvos de 44px. */
  .wr-page{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:980px;min-width:0}
  .wr-tabs{display:flex;gap:6px;padding:4px;border:1px solid var(--color-border);border-radius:999px;background:var(--surface-subtle);width:max-content;max-width:100%;overflow-x:auto}
  .wr-tab{white-space:nowrap}
  .wr-tab{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;color:var(--color-text-muted);font-weight:800;text-decoration:none}
  .wr-tab.is-active{background:var(--color-card);color:var(--menu-active-text);border:1px solid var(--border-brand);box-shadow:var(--shadow-xs)}
  .wr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .wr-head h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.01em}
  .wr-head p{margin:6px 0 0;color:var(--color-text-muted);line-height:1.45;max-width:60ch}
  .wr-new{display:flex;gap:8px;flex-wrap:wrap}
  .wr-title{margin:6px 0 0;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted)}
  .wr-list{display:grid;gap:8px}
  .wr-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 12px;border:1px solid var(--color-border);border-radius:14px;background:var(--color-card);box-shadow:var(--shadow-xs);color:var(--color-text);text-decoration:none}
  .wr-card:hover{border-color:var(--border-brand)}
  .wr-num{display:grid;place-items:center;align-content:center;width:58px;height:58px;border-radius:12px;background:var(--surface-soft);border:1px solid var(--color-border);font-variant-numeric:tabular-nums;line-height:1}
  .wr-num small{font-size:10.5px;font-weight:800;color:var(--color-text-muted)}
  .wr-num strong{margin-top:3px;font-size:18px}
  .wr-card.is-draft .wr-num{border-style:dashed;background:transparent}
  .wr-body{display:grid;gap:3px;min-width:0}
  .wr-body strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wr-meta{display:flex;flex-wrap:wrap;gap:2px 10px;color:var(--color-text-muted);font-size:13.5px}
  .wr-chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--badge-border);background:var(--badge-bg);color:var(--badge-text);font-size:12px;font-weight:900;white-space:nowrap}
  .wr-chip.ok{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
  .wr-empty{padding:16px;border:1px dashed var(--color-border);border-radius:12px;color:var(--color-text-muted);line-height:1.5}
  /* formulario */
  .wr-form{display:grid;gap:14px}
  .wr-box{display:grid;gap:12px;padding:16px;border:1px solid var(--color-border);border-radius:14px;background:var(--color-card)}
  .wr-box h2{margin:0;font-size:16px}
  .wr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .wr-field label{display:block;margin-bottom:5px;font-size:13px;font-weight:800;color:var(--color-text-muted)}
  .wr-field textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
  .wr-hint{margin:-4px 0 0;color:var(--color-text-muted);font-size:13px;line-height:1.4}
  .wr-kind{display:flex;gap:8px;flex-wrap:wrap}
  .wr-kind label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--color-border);border-radius:999px;background:var(--surface-soft);font-weight:800;cursor:pointer}
  .wr-kind label:has(input:checked){border-color:var(--color-primary);background:var(--color-primary-soft)}
  .wr-kind input{width:18px;height:18px;margin:0}
  .wr-errors{padding:10px 12px;border:1px solid var(--danger-border);background:var(--danger-bg);color:var(--danger-text);border-radius:12px}
  .wr-submit{position:sticky;bottom:12px;z-index:5;display:flex;gap:8px;padding:10px;border:1px solid var(--color-border);border-radius:14px;background:color-mix(in oklab,var(--color-card) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .wr-submit .btn.primary{flex:1;justify-content:center}
  [data-kind-panel][hidden]{display:none}
  /* documento (detalhe) */
  .wr-doc{display:grid;border:1px solid var(--color-border);border-radius:16px;background:var(--color-card);box-shadow:var(--shadow-soft);overflow:hidden}
  .wr-doc-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--color-border)}
  .wr-doc-top .kind{font-size:13px;font-weight:800;color:var(--color-text-muted)}
  .wr-doc-top h2{margin:2px 0 0;font-size:24px;line-height:1.2}
  .wr-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:1px solid var(--color-border)}
  .wr-facts div{padding:10px 22px;border-right:1px solid var(--color-border)}
  .wr-facts div:last-child{border-right:0}
  .wr-facts span{display:block;font-size:12px;font-weight:800;color:var(--color-text-muted)}
  .wr-facts strong{display:block;margin-top:2px;font-size:15px}
  .wr-section{padding:16px 22px;border-bottom:1px solid var(--color-border)}
  .wr-section h3{margin:0 0 6px;font-size:15px}
  .wr-section p{margin:0;line-height:1.6;white-space:pre-line}
  .wr-table{width:100%;border-collapse:collapse;font-size:14.5px}
  .wr-table th{padding:10px 22px 6px;text-align:left;font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
  .wr-table td{padding:10px 22px;border-top:1px solid var(--color-border)}
  .wr-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
  .wr-total{display:flex;justify-content:flex-end;gap:18px;flex-wrap:wrap;padding:14px 22px;background:var(--surface-subtle);font-weight:900;font-variant-numeric:tabular-nums}
  .wr-actions{display:flex;gap:8px;flex-wrap:wrap}
  .wr-actions form{margin:0}
  .wr-alert{padding:12px 14px;border:1px solid var(--border-brand);border-radius:14px;background:var(--surface-brand-soft);line-height:1.45}
  .wr-danger summary{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--danger-border);border-radius:10px;color:var(--danger-text);font-weight:800;cursor:pointer}
  .wr-danger[open] summary{margin-bottom:10px}
  .wr-danger p{margin:0 0 10px;color:var(--color-text-muted)}
  @media (max-width:720px){
    .wr-head h1{font-size:24px}
    .wr-grid{grid-template-columns:1fr}
    .wr-card{grid-template-columns:auto minmax(0,1fr)}.wr-card .wr-chip{grid-column:2;justify-self:start}
    .wr-doc-top,.wr-section{padding-left:16px;padding-right:16px}
    .wr-facts{grid-template-columns:1fr}.wr-facts div{padding:10px 16px;border-right:0;border-top:1px solid var(--color-border)}
    .wr-total{justify-content:flex-start;padding:12px 16px}.wr-tab{padding:0 14px}
    .wr-table th,.wr-table td{padding-left:16px;padding-right:16px}
    .wr-actions > *{flex:1 1 calc(50% - 8px)}.wr-actions .btn{width:100%;justify-content:center}
  }
</style>
