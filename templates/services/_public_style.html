<style>
  /* Estilo unico das paginas publicas de Servicos (orcamento, relatorio, proposta).
     Pensado para o cliente final no celular: texto >= 14px, alvos >= 44px, contraste AA. */
  *{box-sizing:border-box}
  :root{--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--accent:#1d4ed8;--accent-ink:#fff;--soft:#f8fafc}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;background:var(--bg);color:var(--ink)}
  .page{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  h1{margin:6px 0 0;font-size:26px;line-height:1.15;overflow-wrap:anywhere}
  h2{margin:0 0 10px;font-size:17px;line-height:1.25}
  p{margin:0;color:var(--muted);overflow-wrap:anywhere}
  .brandline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:14px;letter-spacing:.02em;color:var(--ink)}
  .kind{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border-radius:999px;background:#eff6ff;color:#1e3a8a;font-size:14px;font-weight:700}
  .who{margin-top:8px;color:var(--ink)}
  .issued{margin-top:4px;font-size:14px}
  .total{background:var(--ink);border-color:var(--ink);color:#fff}
  .total .label{display:block;color:#cbd5e1;font-size:14px}
  .total strong{display:block;margin-top:2px;font-size:34px;line-height:1.1;overflow-wrap:anywhere}
  .total p{margin-top:6px;color:#cbd5e1;font-size:14px}
  .rows{margin:0;display:grid;gap:0}
  .rows div{display:flex;justify-content:space-between;gap:12px;padding:10px 0}
  .rows div:not(:last-child){border-bottom:1px solid var(--line)}
  .rows div:first-child{padding-top:0}
  .rows div:last-child{padding-bottom:0}
  .rows dt{color:var(--muted)}
  .rows dd{margin:0;font-weight:700;text-align:right;overflow-wrap:anywhere}
  .list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
  .entry{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft)}
  .entry strong{display:block;overflow-wrap:anywhere}
  .entry small{display:block;margin-top:2px;color:var(--muted);font-size:14px}
  .entry .sum{font-weight:800;white-space:nowrap;text-align:right}
  .entry.muted .sum{font-weight:600;color:var(--muted)}
  .hint{margin-top:10px;font-size:14px}
  .contact .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;margin-top:10px}
  .contact .line{margin-top:8px;font-size:14px}
  .legal{text-align:center;font-size:13px;color:var(--muted);padding:4px 8px 12px}
  @media (max-width:520px){.entry{display:grid;gap:6px}.entry .sum{text-align:left}.rows div{display:grid;gap:2px}.rows dd{text-align:left}h1{font-size:23px}.total strong{font-size:30px}}
  @media print{body{background:#fff}.page{max-width:none;padding:0}.card{break-inside:avoid;border-color:#cbd5e1}.total{background:#fff;color:#000;border:2px solid #000}.total .label,.total p{color:#000}.contact .btn{display:none}}
</style>
