{% if action.method == "post" %}
  <form method="post" action="{{ action.url }}">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action.post_action }}">
    <button class="btn" type="submit">{{ action.label }}</button>
  </form>
{% else %}
  <a class="btn" href="{{ action.url }}" {% if action.external %}target="_blank" rel="noopener"{% endif %}>{{ action.label }}</a>
{% endif %}
